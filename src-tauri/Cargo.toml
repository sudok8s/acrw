[package]
name = "acrw"
version = "0.1.0"
description = "ACRW — A Crow Review Workbench"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sudok8s/acrw"

[lib]
name = "acrw_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
acrw-core = { path = "../crates/acrw-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
